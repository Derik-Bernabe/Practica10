<section class="login-card">
  <div class="login-icon">↪</div>

  <h2>Acceso rápido</h2>

  <p class="description">
    Inicia sesión para ver tus rutinas y gestionar tu membresía.
  </p>

  <form (submit)="$event.preventDefault()">
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" placeholder="Tu usuario o correo electrónico" />

    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="Introduce tu contraseña" />

    <div class="forgot">
      <a href="javascript:void(0)">¿Olvidaste tu contraseña?</a>
    </div>

    <button class="submit-button" type="submit">
      Iniciar sesión <span>→</span>
    </button>
  </form>

  <p class="register-label">¿Aún no eres parte del equipo?</p>

  <div class="secondary-actions">
    <button type="button">Crear cuenta</button>
    <button type="button">Ver planes</button>
  </div>
</section>
